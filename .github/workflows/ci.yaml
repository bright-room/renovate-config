name: ci

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # サプライチェーン攻撃の検知に向けた計測(analyze モード)。
      # syscall を capture して falco-analyze ジョブで通信先・プロセスを可視化する。
      # 検知しても fail させない。
      - name: Start Falco
        uses: falcosecurity/falco-actions/start@558a3ceeee9403e1c875ffbeb704c34c93e24752 # main(タグ未発行のため commit を固定)
        with:
          mode: analyze
          # sysdig 0.41.4 (renovate は digest 単体を追従できないため手動更新)
          sysdig-version: sha256:740a122ba3ab923467c09a25725cdc5b530d93345f00cc1ced1b4a32bd9c52a9
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: renovate-config-validator
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 43.280.4
        run: |
          # 個別列挙だと preset を足したときに載せ忘れる(実際 python.json が漏れていた)。
          # リポジトリ直下の .json はすべて preset なので glob で拾う。
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict *.json
      - name: Stop Falco
        if: always()
        uses: falcosecurity/falco-actions/stop@558a3ceeee9403e1c875ffbeb704c34c93e24752 # main(タグ未発行のため commit を固定)
        with:
          mode: analyze

  # capture を解析して、ジョブ中の通信先 / DNS / プロセスをジョブサマリに出す。
  # 収集が目的のため、検知があっても fail させない。
  falco-analyze:
    needs: [validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 計測が目的のジョブなので、capture が無い等で失敗しても CI をブロックしない
    continue-on-error: true
    permissions:
      contents: read
      actions: read

    steps:
      - name: Analyze
        uses: falcosecurity/falco-actions/analyze@558a3ceeee9403e1c875ffbeb704c34c93e24752 # main(タグ未発行のため commit を固定)
        with:
          # falco 0.39.2 (renovate は digest 単体を追従できないため手動更新)
          falco-version: sha256:ba05dfb209cc1c2e912ce116d230b5f59c4542e7286f05b663c499066d5d6a42
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
